name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up MSYS2 (MinGW-w64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            make

      - name: Build and Run Unit Tests
        shell: msys2 {0}
        run: |
          which g++ || true
          g++ --version || true
          mkdir -p bin tests Release
          make clean
          make all
          ./tests/test_runner.exe

      - name: Create Release Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zipName = "AdbTransfer-${tag}-windows-x64.zip"
          Compress-Archive -Path "Release\*" -DestinationPath $zipName -Force
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: false
