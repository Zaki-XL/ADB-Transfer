name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Release Directory
        shell: pwsh
        run: |
          if (-not (Test-Path "Release/AdbTransfer.exe")) {
            throw "Release/AdbTransfer.exe does not exist in repository!"
          }

      - name: Create Release Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zipName = "AdbTransfer-${tag}-windows-x64.zip"
          Compress-Archive -Path "Release\*" -DestinationPath $zipName -Force
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: false
